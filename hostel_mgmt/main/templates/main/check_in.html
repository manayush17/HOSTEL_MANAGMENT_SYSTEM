<!DOCTYPE html>
<html>
<head>
    <title>Check In</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        p {
            font-size: 16px;
            color: #444;
        }

        form {
            margin-top: 20px;
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #003d99;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .full {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Room Details</h1>
        <p><strong>Room Number:</strong> {{ room.number }}</p>
        <p><strong>Current Occupants:</strong> {{ current_capacity }} / 3</p>

        {% if current_capacity >= 3 %}
            <p class="full">This room is full and cannot be booked by any more students.</p>
        {% else %}
            <form method="POST">
                {% csrf_token %}
                <label for="transaction_id">Enter Transaction ID:</label>
                <input type="text" name="transaction_id" required>
                <button type="submit">Confirm Booking</button>
            </form>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
